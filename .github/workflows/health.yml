# The Oracle VM does not sleep, so there is nothing to keep warm. This is an
# uptime check instead: it tells you the box died before a visitor does.
name: Inference health check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 60 \
            "${{ secrets.GARGI_INFERENCE_URL }}/health")
          echo "HTTP $code"; cat /tmp/health.json
          test "$code" = "200"
          python3 -c "
import json,sys
d = json.load(open('/tmp/health.json'))
assert d.get('ok'), 'service reports not ok'
assert set(d.get('models', {})) == {'instruct', 'base'}, f\"expected both checkpoints, got {list(d.get('models', {}))}\"
print('both checkpoints loaded, uptime', d.get('uptime_s'), 's')
"
